<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/jpeg" href="/static/ai1234.jpg" />
  <title>Shubham's Voice Assistant</title>

  <!-- KEEP YOUR CSS FILE UNCHANGED -->
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <img src="/static/initiating.gif" alt="Starting..." />
  </div>

  <!-- MAIN UI -->
  <div id="main-ui" style="display:none;">
    <img id="bg-wallpaper" src="/static/live_wallpaper.gif" alt="wallpaper" />

    <h1>
      Shubham's Voice Assistant
    </h1>

    <div class="mic-zone" id="mic-zone">
      <!-- Ripple rings (CSS handles animation) -->
      <div class="ripple-ring ring1"></div>
      <div class="ripple-ring ring2"></div>
      <div class="ripple-ring ring3"></div>

      <!-- mic button -->
      <button id="mic-btn" aria-label="Activate microphone">
        <img src="/static/mic.png" alt="mic" />
      </button>

      <div id="transcript"></div>
      <div id="response"></div>
      <div style="text-align:center; color:#9fe; margin-top:8px; font-size:12px;">
        Wake phrase (one-shot): say "Hey Sky" followed by your command, e.g. "Hey Sky open YouTube".
      </div>
    </div>
  </div>

  <script>
    /*
      Final integrated JavaScript for:
      - Mobile + Desktop friendly speech recognition
      - One-shot wake-word "Hey Sky"
      - Many local commands (apps, calls, camera, weather, news, cricket, wiki, translate, reminders, media control)
      - WebView integration API: window.ShubhamVoice & window.__onRecognitionResult
      - Uses external CSS at /static/style.css (kept unchanged)
    */

    /* ===========================
       Helpers
    ============================*/
    function sanitizeForSpeech(text) {
      if (!text) return "";
      text = text.replace(/[*_`>#\-\[\]\(\)~]/g, "");
      text = text.replace(/\s+/g, " ").trim();
      return text;
    }

    /* UI references */
    const micBtn = document.getElementById("mic-btn");
    const micZone = document.getElementById("mic-zone");
    const transcriptDiv = document.getElementById("transcript");
    const responseDiv = document.getElementById("response");
    const loadingScreen = document.getElementById("loading-screen");
    const mainUI = document.getElementById("main-ui");

    /* Configuration (set API keys here if you have them) */
    const CONFIG = {
      WEATHER_API_KEY: "", // OpenWeatherMap key (optional)
      NEWS_API_KEY: "",    // NewsAPI key (optional)
      CRICKET_API_KEY: "", // any cricket API key (optional)
      TRANSLATE_API_URL: "https://libretranslate.de/translate", // public instance (use your own in prod)
      ALLOW_AUTOSTART_AFTER_RESPONSE: true,
      WAKE_PHRASE: "hey sky"
    };

    /* Feature detection */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition || null;
    if (!SpeechRecognition) {
      console.warn("SpeechRecognition API not available in this browser.");
    }

    /* State */
    let recognition = null;
    let greetedOnce = false;
    let userInitiated = false;
    let currentlyListening = false;
    let lastStartTimestamp = 0;
    let restartAttempts = 0;
    const RESTART_ATTEMPT_LIMIT = 4;
    const RESTART_COOLDOWN_MS = 3500;

    /* Text-to-speech */
    function speak(text, opts = { autoListen: false }) {
      text = sanitizeForSpeech(text);
      if (!text) return;

      responseDiv.textContent = text;
      responseDiv.classList.add("glow");

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      utter.onend = () => {
        responseDiv.classList.remove("glow");
        if (opts.autoListen && recognition && userInitiated && CONFIG.ALLOW_AUTOSTART_AFTER_RESPONSE) {
          tryStartRecognitionWithSafety();
        }
      };

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }

    /* Page load: show UI and greet once */
    window.addEventListener("load", () => {
      setTimeout(() => {
        loadingScreen.style.display = "none";
        mainUI.style.display = "block";
        if (!greetedOnce) {
          greetedOnce = true;
          speak("How may I help you, sir?");
        }
      }, 700);
    });

    /* Initialize recognition lazily */
    function initRecognition() {
      if (!SpeechRecognition) return null;
      if (recognition) return recognition;

      recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = true;
      recognition.continuous = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        currentlyListening = true;
        lastStartTimestamp = Date.now();
        micZone.classList.add("listening");
        micBtn.classList.add("listening");
        transcriptDiv.textContent = "Listening...";
        restartAttempts = 0;
      };

      recognition.onresult = async (event) => {
        try {
          let interim = "";
          let finalTranscript = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const r = event.results[i];
            if (r.isFinal) finalTranscript += r[0].transcript;
            else interim += r[0].transcript;
          }
          const raw = (finalTranscript || interim || "").trim();
          if (!raw) return;
          const textLower = raw.toLowerCase().trim();

          transcriptDiv.textContent = "You said: " + raw;

          // expose to embedding
          try {
            if (window.__onRecognitionResult && typeof window.__onRecognitionResult === "function") {
              window.__onRecognitionResult(raw);
            }
          } catch (e) {
            console.warn("Error calling __onRecognitionResult:", e);
          }

          // wake-phrase one-shot handling
          const wake = CONFIG.WAKE_PHRASE.toLowerCase();
          let handled = false;
          if (textLower.includes(wake)) {
            const idx = textLower.lastIndexOf(wake);
            const after = raw.substring(idx + wake.length).trim();
            if (after) {
              await processCommand(after);
              handled = true;
            } else {
              // only wake phrase without immediate command - acknowledge briefly
              speak("Yes?");
              handled = true;
            }
          }

          // If not handled by wake-word but user started mic, handle full utterance
          if (!handled && userInitiated) {
            await processCommand(raw);
          }

        } catch (err) {
          console.error("onresult error:", err);
        }
      };

      recognition.onerror = (event) => {
        currentlyListening = false;
        micZone.classList.remove("listening");
        micBtn.classList.remove("listening");
        console.warn("Recognition error:", event.error);
        if (event.error === "no-speech") {
          transcriptDiv.textContent = "I did not catch that. Please tap the mic and speak again.";
        } else if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          transcriptDiv.textContent = "Microphone permission is blocked. Please allow mic access in browser settings.";
        } else if (event.error === "network") {
          transcriptDiv.textContent = "Network error during recognition.";
        } else {
          transcriptDiv.textContent = "Error: " + event.error;
        }
      };

      recognition.onend = () => {
        currentlyListening = false;
        micZone.classList.remove("listening");
        micBtn.classList.remove("listening");
        const now = Date.now();
        if (userInitiated && (now - lastStartTimestamp) > 200 && restartAttempts < RESTART_ATTEMPT_LIMIT) {
          restartAttempts++;
          setTimeout(() => {
            tryStartRecognitionWithSafety();
          }, RESTART_COOLDOWN_MS);
        }
      };

      return recognition;
    }

    /* Safe start */
    function tryStartRecognitionWithSafety() {
      if (!SpeechRecognition) {
        alert("Speech recognition not supported in this browser. Use Chrome on Android or desktop Chrome for best results.");
        return;
      }
      initRecognition();
      const now = Date.now();
      if (currentlyListening) return;
      if ((now - lastStartTimestamp) < 700) return;
      try {
        recognition.start();
      } catch (e) {
        console.warn("recognition.start() failed:", e);
        try { recognition = null; initRecognition(); } catch (err) { console.warn("re-init failed:", err); }
      }
    }

    /* Central command processor */
    async function processCommand(rawText) {
      if (!rawText || typeof rawText !== "string") return false;
      const text = rawText.toLowerCase().trim();

      // battery
      if (text.includes("battery") || text.includes("battery status") || text.includes("how much battery")) {
        return batteryStatus();
      }

      // time
      if (/\btime\b/.test(text) || text.includes("what time")) {
        return tellTime();
      }

      // date
      if (text.includes("date") || text.includes("today's date") || text.includes("what date")) {
        return tellDate();
      }

      // vibrate
      if (text.includes("vibrate") || text.includes("start vibration")) {
        return vibratePhone(1000);
      }
      if (text.includes("stop vibration") || text.includes("stop vibrate")) {
        return vibratePhone(0);
      }

      // volume
      if (text.includes("volume up") || text.includes("increase volume")) {
        return adjustVolume("up");
      }
      if (text.includes("volume down") || text.includes("decrease volume")) {
        return adjustVolume("down");
      }
      if (text.includes("mute") && text.includes("volume")) {
        return adjustVolume("mute");
      }

      // brightness guidance
      if (text.includes("brightness up") || text.includes("increase brightness")) {
        return changeBrightness("up");
      }
      if (text.includes("brightness down") || text.includes("decrease brightness")) {
        return changeBrightness("down");
      }

      // quick app openers
      if (text.includes("open youtube")) {
        speak("Opening YouTube.");
        openApp(["youtube://", "vnd.youtube://"], "https://www.youtube.com");
        return true;
      }
      if (text.includes("open whatsapp")) {
        speak("Opening WhatsApp.");
        openApp(["whatsapp://send", "whatsapp-business://send"], "https://wa.me");
        return true;
      }
      if (text.includes("open instagram")) {
        speak("Opening Instagram.");
        openApp(["instagram://app"], "https://instagram.com");
        return true;
      }
      if (text.includes("open facebook")) {
        speak("Opening Facebook.");
        openApp(["fb://feed", "fb://profile"], "https://facebook.com");
        return true;
      }
      if (text.includes("open telegram")) {
        speak("Opening Telegram.");
        openApp(["tg://", "telegram://"], "https://telegram.org");
        return true;
      }
      if (text.includes("open linkedin")) {
        speak("Opening LinkedIn.");
        openApp(["linkedin://"], "https://www.linkedin.com");
        return true;
      }
      if (text.includes("open zomato")) {
        speak("Opening Zomato.");
        openApp([], "https://www.zomato.com");
        return true;
      }
      if (text.includes("open swiggy")) {
        speak("Opening Swiggy.");
        openApp([], "https://www.swiggy.com");
        return true;
      }
      if (text.includes("open flipkart")) {
        speak("Opening Flipkart.");
        openApp([], "https://www.flipkart.com");
        return true;
      }
      if (text.includes("open amazon")) {
        speak("Opening Amazon.");
        openApp([], "https://www.amazon.in");
        return true;
      }
      if (text.includes("open uber")) {
        speak("Opening Uber.");
        openApp([], "https://www.uber.com");
        return true;
      }
      if (text.includes("open ola")) {
        speak("Opening Ola.");
        openApp([], "https://www.olacabs.com");
        return true;
      }

      // navigation / maps
      if (text.startsWith("navigate to ") || text.startsWith("take me to ") || text.startsWith("directions to ")) {
        const place = rawText.replace(/navigate to|take me to|directions to/i, "").trim();
        if (place) {
          speak("Navigating to " + place + ".");
          const url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(place)}`;
          window.open(url, "_blank");
          return true;
        }
      }

      // search / play
      if (text.startsWith("search for ") || text.startsWith("find ")) {
        const q = rawText.replace(/search for|find/i, "").trim();
        speak("Searching " + q + ".");
        window.open("https://www.google.com/search?q=" + encodeURIComponent(q), "_blank");
        return true;
      }
      if (text.startsWith("play ")) {
        const q = rawText.replace(/^play\s*/i, "").trim();
        speak("Playing " + q + " on YouTube.");
        window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(q), "_blank");
        return true;
      }

      // call
      if (text.startsWith("call ")) {
        const num = rawText.replace(/^call\s*/i, "").trim();
        if (num) {
          speak("Calling " + num + ".");
          window.location.href = `tel:${num}`;
          return true;
        }
      }

      // sms
      if (text.startsWith("send sms to ")) {
        const num = rawText.replace(/^send sms to\s*/i, "").trim();
        speak("Opening messages for " + num + ".");
        window.location.href = `sms:${num}`;
        return true;
      }

      // camera/gallery
      if (text.includes("open camera") || text.includes("start camera")) {
        speak("Opening camera.");
        window.location.href = "camera://";
        setTimeout(() => {
          window.location.href = "intent://camera#Intent;scheme=android;end";
        }, 600);
        return true;
      }
      if (text.includes("open gallery") || text.includes("open photos")) {
        speak("Opening gallery.");
        window.location.href = "photos-redirect://";
        setTimeout(() => {
          window.location.href = "gallery://";
        }, 600);
        return true;
      }

      // weather
      if (text.includes("weather") || text.includes("what's the weather") || text.includes("temperature")) {
        const place = extractPlaceFromText(rawText);
        await provideWeather(place);
        return true;
      }

      // news
      if (text.includes("news") || text.includes("headlines")) {
        await provideNews();
        return true;
      }

      // cricket
      if (text.includes("cricket") || text.includes("cricket score")) {
        await provideCricket();
        return true;
      }

      // wikipedia
      if (text.startsWith("who is ") || text.startsWith("what is ") || text.includes("wikipedia")) {
        const query = rawText.replace(/who is|what is|wikipedia/i, "").trim();
        if (query) {
          speak("Searching Wikipedia for " + query);
          window.open("https://en.wikipedia.org/wiki/" + encodeURIComponent(query), "_blank");
          return true;
        }
      }

      // translate
      if (text.startsWith("translate ") || text.includes("translate to")) {
        await doTranslate(rawText);
        return true;
      }

      // reply mode
      if (text.includes("short mode") || text.includes("short answers")) {
        localStorage.setItem("replyMode", "short");
        speak("Short conversation mode enabled.");
        return true;
      }
      if (text.includes("long mode") || text.includes("detailed answers")) {
        localStorage.setItem("replyMode", "long");
        speak("Detailed conversation mode enabled.");
        return true;
      }

      // media controls
      if (text.includes("pause") && text.includes("music")) {
        return controlMedia("pause");
      }
      if ((text.includes("play") && text.includes("music")) || (text.includes("resume") && text.includes("music"))) {
        return controlMedia("play");
      }
      if (text.includes("next song") || text.includes("next track")) {
        return controlMedia("next");
      }
      if (text.includes("previous song") || text.includes("previous track")) {
        return controlMedia("prev");
      }

      // reminders
      if (text.startsWith("remind me to ")) {
        const payload = rawText.replace(/^remind me to\s*/i, "").trim();
        scheduleLocalReminder(payload);
        return true;
      }

      // fallback: send to backend
      return sendToBackendForReply(rawText);
    }

    /* extract place */
    function extractPlaceFromText(text) {
      const m = text.match(/weather (in|for) (.+)/i);
      if (m && m[2]) return m[2].trim();
      return "";
    }

    /* battery status */
    async function batteryStatus() {
      try {
        if (!navigator.getBattery) {
          speak("Battery API not supported in this browser.");
          return true;
        }
        const b = await navigator.getBattery();
        const pct = Math.round(b.level * 100);
        const charging = b.charging ? "and charging" : "and not charging";
        speak(`Battery is ${pct} percent ${charging}.`);
      } catch (e) {
        console.warn("Battery API error", e);
        speak("Unable to read battery status.");
      }
      return true;
    }

    /* time & date */
    function tellTime() {
      const now = new Date();
      const hh = now.getHours();
      const mm = now.getMinutes();
      const ampm = hh >= 12 ? "PM" : "AM";
      const displayHour = ((hh + 11) % 12 + 1);
      speak(`The time is ${displayHour} ${mm === 0 ? "" : mm + " minutes"} ${ampm}.`);
      return true;
    }

    function tellDate() {
      const now = new Date();
      const date = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      speak(`Today is ${date}.`);
      return true;
    }

    /* vibration */
    function vibratePhone(durationMs) {
      if (navigator.vibrate) {
        if (durationMs > 0) {
          navigator.vibrate(durationMs);
          speak("Vibrating for a moment.");
        } else {
          navigator.vibrate(0);
          speak("Vibration stopped.");
        }
      } else {
        speak("Vibration not supported in this device browser.");
      }
      return true;
    }

    /* volume (page-limited) */
    function adjustVolume(direction) {
      const media = document.querySelector("video, audio");
      if (!media) {
        speak("Cannot change system volume from the browser. I can only adjust media players on the page if present.");
        return true;
      }
      const step = 0.1;
      if (direction === "up") {
        media.volume = Math.min(1, media.volume + step);
        speak("Increased player volume.");
      } else if (direction === "down") {
        media.volume = Math.max(0, media.volume - step);
        speak("Decreased player volume.");
      } else if (direction === "mute") {
        media.muted = true;
        speak("Muted media player.");
      }
      return true;
    }

    /* brightness guidance */
    function changeBrightness(direction) {
      if (direction === "up") {
        speak("I cannot change system brightness from the browser. On Android, swipe down and adjust brightness. On desktop, use your system settings.");
      } else {
        speak("I cannot change system brightness from the browser. Please adjust brightness from quick settings.");
      }
      return true;
    }

    /* open app helper */
    function openApp(appLinks, fallbackUrl) {
      if (!Array.isArray(appLinks) || appLinks.length === 0) {
        if (fallbackUrl) window.open(fallbackUrl, "_blank");
        return;
      }
      try {
        window.location.href = appLinks[0];
      } catch (e) {
        console.warn("deep link failed", e);
      }
      if (appLinks[1]) {
        setTimeout(() => {
          try { window.location.href = appLinks[1]; } catch (e) {}
        }, 600);
      }
      if (fallbackUrl) {
        setTimeout(() => {
          window.open(fallbackUrl, "_blank");
        }, 1200);
      }
    }

    /* weather */
    async function provideWeather(place = "") {
      try {
        if (CONFIG.WEATHER_API_KEY) {
          const q = place || "";
          const base = "https://api.openweathermap.org/data/2.5/weather";
          const url = `${base}?q=${encodeURIComponent(q)}&units=metric&appid=${CONFIG.WEATHER_API_KEY}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error("Weather API response not ok");
          const j = await res.json();
          const temp = Math.round(j.main.temp);
          const desc = j.weather[0].description;
          speak(`Current weather in ${j.name} is ${desc} with ${temp} degrees Celsius.`);
          return true;
        } else {
          if (place) {
            window.open(`https://wttr.in/${encodeURIComponent(place)}?m`, "_blank");
            speak(`Opening weather for ${place}.`);
          } else {
            window.open("https://wttr.in/?m", "_blank");
            speak("Opening weather.");
          }
          return true;
        }
      } catch (e) {
        console.error("Weather error", e);
        speak("Unable to fetch weather right now.");
        return true;
      }
    }

    /* news */
    async function provideNews() {
      try {
        if (CONFIG.NEWS_API_KEY) {
          const url = `https://newsapi.org/v2/top-headlines?country=in&pageSize=5&apiKey=${CONFIG.NEWS_API_KEY}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error("News API error");
          const j = await res.json();
          const articles = j.articles || [];
          if (articles.length === 0) {
            speak("I couldn't find recent headlines.");
            return true;
          }
          const top = articles.slice(0, 3);
          let speakText = "Here are the top headlines: ";
          top.forEach((a, i) => {
            speakText += `Headline ${i + 1}: ${a.title}. `;
          });
          speak(speakText);
          window.open("https://news.google.com/topstories", "_blank");
          return true;
        } else {
          window.open("https://news.google.com/topstories", "_blank");
          speak("Opening latest news.");
          return true;
        }
      } catch (e) {
        console.error("News error", e);
        speak("Unable to fetch news right now.");
        return true;
      }
    }

    /* cricket */
    async function provideCricket() {
      try {
        if (CONFIG.CRICKET_API_KEY) {
          speak("Fetching cricket scores.");
          window.open("https://www.espncricinfo.com", "_blank");
          return true;
        } else {
          window.open("https://www.espncricinfo.com", "_blank");
          speak("Opening cricket scores.");
          return true;
        }
      } catch (e) {
        console.error("Cricket error", e);
        speak("Unable to fetch cricket scores.");
        return true;
      }
    }

    /* wiki quick */
    async function wikiSummary(query) {
      try {
        const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Wikipedia error");
        const j = await res.json();
        if (j.extract) speak(j.extract);
        else speak("I couldn't find an article for that.");
        return true;
      } catch (e) {
        console.error("Wiki error", e);
        speak("Unable to reach Wikipedia right now.");
        return true;
      }
    }

    /* translate */
    async function doTranslate(raw) {
      try {
        const m = raw.match(/translate\s+(.+?)\s+to\s+([a-zA-Z]+)/i);
        if (!m) {
          speak("Please say: translate followed by the phrase and then to language. Example: translate how are you to Hindi.");
          return true;
        }
        const phrase = m[1].replace(/(^['"]|['"]$)/g, "").trim();
        const lang = m[2].toLowerCase();
        const langMap = { hindi: "hi", english: "en", spanish: "es", french: "fr" };
        const target = langMap[lang] || lang.slice(0,2);
        const data = { q: phrase, source: "auto", target: target, format: "text" };
        const res = await fetch(CONFIG.TRANSLATE_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error("Translate API failed");
        const j = await res.json();
        const translated = j.translatedText || j.result || "";
        if (translated) speak(`Translation: ${translated}`);
        else speak("I could not translate that.");
      } catch (e) {
        console.error("Translate error", e);
        speak("Translation failed. Check your translate API.");
      }
      return true;
    }

    /* media control */
    function controlMedia(action) {
      const media = document.querySelector("audio, video");
      if (!media) {
        speak("No media player found on this page to control.");
        return true;
      }
      try {
        if (action === "pause") media.pause();
        else if (action === "play") media.play();
        else if (action === "next") speak("Next track requested. Use your media app controls.");
        else if (action === "prev") speak("Previous track requested.");
        speak("Media command executed.");
      } catch (e) {
        console.warn("Media control error", e);
        speak("Could not control media.");
      }
      return true;
    }

    /* reminders */
    function scheduleLocalReminder(text) {
      if (!text) {
        speak("Please tell me what to remind you about.");
        return true;
      }
      speak(`Reminder set: ${text}. I will remind you in 10 seconds.`);
      setTimeout(() => { speak(`Reminder: ${text}`); }, 10000);
      return true;
    }

    /* backend fallback */
    async function sendToBackendForReply(raw) {
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: raw, replyMode: localStorage.getItem("replyMode") || "short" })
        });
        if (!res.ok) throw new Error("Network response was not ok");
        const data = await res.json();
        let reply = (data.reply || "").toString();
        reply = sanitizeForSpeech(reply);
        const shouldAutoListen = !!data.follow_up;
        speak(reply || "I have nothing to say.");
        return true;
      } catch (err) {
        console.error("Backend error:", err);
        speak("Something went wrong connecting to the server.");
        return true;
      }
    }

    /* small utils */
    function extractNumber(text) {
      const m = text.match(/\d+/);
      return m ? parseInt(m[0], 10) : null;
    }

    /* mic button behavior */
    micBtn.addEventListener("click", () => {
      initRecognition();
      if (currentlyListening && recognition) {
        try { recognition.stop(); } catch (e) { console.warn("stop failed:", e); }
        return;
      }
      userInitiated = true;
      restartAttempts = 0;
      tryStartRecognitionWithSafety();
    });

    /* keyboard shortcut */
    window.addEventListener("keydown", (ev) => {
      if (ev.key === "m" || ev.key === "M") micBtn.click();
    });

    /* WebView / integration API */
    window.ShubhamVoice = {
      speak: (text) => speak(text || ""),
      startListening: () => { userInitiated = true; initRecognition(); tryStartRecognitionWithSafety(); },
      stopListening: () => { if (recognition && currentlyListening) try { recognition.stop(); } catch(e){} },
      getConfig: () => ({ ...CONFIG }),
      setConfig: (newConf) => { Object.assign(CONFIG, newConf); localStorage.setItem('assistant_config', JSON.stringify(CONFIG)); }
    };

    /* fallback message for unsupported browsers */
    if (!SpeechRecognition) {
      transcriptDiv.textContent = "Voice recognition not fully supported. Use Chrome (desktop or Android) for best results.";
    }
  </script>
</body>
</html>
