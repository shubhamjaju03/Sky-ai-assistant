<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/jpeg" href="/static/ai1234.jpg" />
  <title>Shubham's Voice Assistant</title>

  <!-- external CSS (keeps UI unchanged) -->
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <img src="/static/initiating.gif" alt="Starting..." />
  </div>

  <!-- MAIN UI -->
  <div id="main-ui" style="display:none;">
    <img id="bg-wallpaper" src="/static/live_wallpaper.gif" alt="wallpaper" />

    <h1 style="text-align:center; color:#00ffcc; margin-top:36px;">
      Shubham's Voice Assistant
    </h1>

    <div class="mic-zone" id="mic-zone">
      <!-- Ripple rings (CSS handles animation) -->
      <div class="ripple-ring ring1"></div>
      <div class="ripple-ring ring2"></div>
      <div class="ripple-ring ring3"></div>

      <!-- mic button -->
      <button id="mic-btn" aria-label="Activate microphone">
        <img src="/static/mic.png" alt="mic" />
      </button>

      <div id="transcript"></div>
      <div id="response"></div>
    </div>
  </div>

  <script>
    /* ========== Helper: sanitize text for speech & display ========== */
    function sanitizeForSpeech(text) {
      if (!text) return "";
      // remove markdown/symbol characters
      text = text.replace(/[*_`>#\-\[\]\(\)~]/g, "");
      // collapse whitespace/newlines
      text = text.replace(/\s+/g, " ").trim();
      return text;
    }

    /* ========== UI references ========== */
    const micBtn = document.getElementById("mic-btn");
    const micZone = document.getElementById("mic-zone");
    const transcriptDiv = document.getElementById("transcript");
    const responseDiv = document.getElementById("response");
    const loadingScreen = document.getElementById("loading-screen");
    const mainUI = document.getElementById("main-ui");

    /* ========== Speech Recognition setup ========== */
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("Voice recognition requires Chrome or Edge. Some features may not work.");
    }

    const recognition = SpeechRecognition ? new SpeechRecognition() : null;
    if (recognition) {
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.continuous = false;
      recognition.maxAlternatives = 1;
    }

    /* state flags */
    let greetedOnce = false;      // greet only once per page load
    let userInitiated = false;    // user tapped mic at least once
    let currentlyListening = false;

    /* ========== Text-to-speech with optional auto-listen ========== */
    function speak(text, opts = { autoListen: false }) {
      text = sanitizeForSpeech(text);
      if (!text) return;

      responseDiv.textContent = text;
      responseDiv.classList.add("glow");

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";

      utter.onend = () => {
        responseDiv.classList.remove("glow");
        // auto re-listen only if user has already granted mic via a tap
        if (opts.autoListen && recognition && userInitiated) {
          try {
            recognition.start();
          } catch (e) {
            console.warn("Auto-listen failed:", e);
          }
        }
      };

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }

    /* ========== Page load: show UI & greet once (no auto-mic) ========== */
    window.addEventListener("load", () => {
      setTimeout(() => {
        loadingScreen.style.display = "none";
        mainUI.style.display = "block";

        if (!greetedOnce) {
          greetedOnce = true;
          speak("How may I help you, sir?");
        }
      }, 900);
    });

    /* ========== Helper: universal deep-link opener ========== */
    function openApp(appLinks, fallbackUrl) {
      if (!Array.isArray(appLinks) || appLinks.length === 0) {
        if (fallbackUrl) window.open(fallbackUrl, "_blank");
        return;
      }

      // try primary deep link
      window.location.href = appLinks[0];

      // secondary deep link if provided
      if (appLinks[1]) {
        setTimeout(() => {
          window.location.href = appLinks[1];
        }, 600);
      }

      // final fallback to browser URL
      if (fallbackUrl) {
        setTimeout(() => {
          window.open(fallbackUrl, "_blank");
        }, 1200);
      }
    }

    /* ========== LOCAL COMMAND HANDLER (apps + system) ========== */
    function handleLocalCommands(text) {
      // CREATOR
      if (text.includes("who made you") || text.includes("creator")) {
        const msg = "I was created by Shubham Jaju.";
        speak(msg);
        return true;
      }

      /* ---------- APP LAUNCHERS ---------- */

      if (text.includes("open whatsapp")) {
        speak("Opening WhatsApp.");
        openApp(
          ["whatsapp://send", "whatsapp-business://send"],
          "https://wa.me"
        );
        return true;
      }

      if (text.includes("open instagram")) {
        speak("Opening Instagram.");
        openApp(
          ["instagram://app"],
          "https://instagram.com"
        );
        return true;
      }

      if (text.includes("open youtube")) {
        speak("Opening YouTube.");
        openApp(
          ["youtube://", "vnd.youtube://"],
          "https://youtube.com"
        );
        return true;
      }

      if (text.includes("open facebook")) {
        speak("Opening Facebook.");
        openApp(
          ["fb://feed", "fb://profile"],
          "https://facebook.com"
        );
        return true;
      }

      if (text.includes("open messenger")) {
        speak("Opening Messenger.");
        openApp(
          ["fb-messenger://"],
          "https://m.me"
        );
        return true;
      }

      if (text.includes("open twitter") || text.includes("open x")) {
        speak("Opening X.");
        openApp(
          ["twitter://", "x://"],
          "https://x.com"
        );
        return true;
      }

      if (text.includes("open snapchat")) {
        speak("Opening Snapchat.");
        openApp(
          ["snapchat://"],
          "https://snapchat.com"
        );
        return true;
      }

      if (text.includes("open telegram")) {
        speak("Opening Telegram.");
        openApp(
          ["tg://", "telegram://"],
          "https://telegram.org"
        );
        return true;
      }

      if (text.includes("open chrome")) {
        speak("Opening Chrome.");
        openApp(
          ["googlechrome://"],
          "https://google.com"
        );
        return true;
      }

      if (text.includes("open maps") || text.includes("open google maps")) {
        speak("Opening Maps.");
        openApp(
          ["comgooglemaps://", "maps://"],
          "https://maps.google.com"
        );
        return true;
      }

      if (text.includes("open gmail")) {
        speak("Opening Gmail.");
        openApp(
          ["googlegmail://"],
          "https://mail.google.com"
        );
        return true;
      }

      if (text.includes("open spotify")) {
        speak("Opening Spotify.");
        openApp(
          ["spotify://"],
          "https://open.spotify.com"
        );
        return true;
      }

      if (text.includes("open prime video")) {
        speak("Opening Prime Video.");
        openApp(
          ["primevideo://"],
          "https://primevideo.com"
        );
        return true;
      }

      if (text.includes("open hotstar")) {
        speak("Opening Hotstar.");
        openApp(
          ["hotstar://"],
          "https://www.hotstar.com"
        );
        return true;
      }

      if (text.includes("open netflix")) {
        speak("Opening Netflix.");
        openApp(
          ["nflx://"],
          "https://netflix.com"
        );
        return true;
      }

      if (text.includes("open paytm")) {
        speak("Opening Paytm.");
        openApp(
          ["paytm://"],
          "https://paytm.com"
        );
        return true;
      }

      if (text.includes("open phonepe") || text.includes("open phone pay")) {
        speak("Opening PhonePe.");
        openApp(
          ["phonepe://"],
          "https://phonepe.com"
        );
        return true;
      }

      if (text.includes("open jio")) {
        speak("Opening MyJio.");
        openApp(
          ["myjio://"],
          "https://www.jio.com"
        );
        return true;
      }

      /* ---------- SEARCH & MEDIA ---------- */

      if (text.startsWith("search for ")) {
        const q = text.replace(/^search for\s*/i, "").trim();
        speak("Searching " + q + ".");
        window.open(
          "https://www.google.com/search?q=" + encodeURIComponent(q),
          "_blank"
        );
        return true;
      }

      if (text.startsWith("play ")) {
        const q = text.replace(/^play\s*/i, "").trim();
        speak("Playing " + q + " on YouTube.");
        window.open(
          "https://www.youtube.com/results?search_query=" + encodeURIComponent(q),
          "_blank"
        );
        return true;
      }

      /* ---------- SYSTEM / DEVICE COMMANDS ---------- */

      // CAMERA
      if (text.includes("open camera") || text.includes("start camera")) {
        speak("Opening camera.");
        window.location.href = "camera://";
        setTimeout(() => {
          window.location.href = "intent://camera#Intent;scheme=android;end";
        }, 600);
        return true;
      }

      // GALLERY / PHOTOS
      if (text.includes("open gallery") || text.includes("open photos")) {
        speak("Opening gallery.");
        window.location.href = "photos-redirect://";
        setTimeout(() => {
          window.location.href = "gallery://";
        }, 600);
        return true;
      }

      // DIALER
      if (text.includes("open dialer") || text.includes("open phone")) {
        speak("Opening dialer.");
        window.location.href = "tel://";
        return true;
      }

      // CALL A NUMBER
      if (text.startsWith("call ")) {
        const number = text.replace("call", "").trim();
        if (number) {
          speak("Calling " + number + ".");
          window.location.href = `tel:${number}`;
        } else {
          speak("Please say the number clearly.");
        }
        return true;
      }

      // SMS
      if (text.startsWith("send sms to ")) {
        const number = text.replace("send sms to", "").trim();
        speak("Opening messages.");
        window.location.href = `sms:${number}`;
        return true;
      }

      // SETTINGS
      if (text.includes("open settings")) {
        speak("Opening settings.");
        window.location.href = "App-Prefs://";
        setTimeout(() => {
          window.location.href = "intent://settings#Intent;scheme=android;end";
        }, 600);
        return true;
      }

      // WIFI SETTINGS
      if (text.includes("open wifi") || text.includes("open wi-fi")) {
        speak("Opening Wi-Fi settings.");
        window.location.href = "App-Prefs:root=WIFI";
        setTimeout(() => {
          window.location.href = "intent://wifi#Intent;scheme=android;end";
        }, 600);
        return true;
      }

      // BLUETOOTH SETTINGS
      if (text.includes("open bluetooth")) {
        speak("Opening Bluetooth settings.");
        window.location.href = "App-Prefs:root=Bluetooth";
        setTimeout(() => {
          window.location.href = "intent://bluetooth#Intent;scheme=android;end";
        }, 600);
        return true;
      }

      // HOTSPOT
      if (text.includes("open hotspot")) {
        speak("Opening hotspot settings.");
        window.location.href = "App-Prefs:root=INTERNET_TETHERING";
        setTimeout(() => {
          window.location.href = "intent://tethering#Intent;scheme=android;end";
        }, 600);
        return true;
      }

      // CALCULATOR
      if (text.includes("open calculator")) {
        speak("Opening calculator.");
        window.location.href = "calculator://";
        setTimeout(() => {
          window.location.href = "intent://calculator#Intent;scheme=android;end";
        }, 600);
        return true;
      }

      // CLOCK / ALARM
      if (text.includes("open alarm") || text.includes("open clock")) {
        speak("Opening clock.");
        window.location.href = "clock-alarm://";
        setTimeout(() => {
          window.location.href = "intent://clock#Intent;scheme=android;end";
        }, 600);
        return true;
      }

      // CALENDAR
      if (text.includes("open calendar")) {
        speak("Opening calendar.");
        window.location.href = "calshow://";
        setTimeout(() => {
          window.location.href = "intent://calendar#Intent;scheme=android;end";
        }, 600);
        return true;
      }

      // TORCH / FLASHLIGHT
      if (text.includes("turn on torch") || text.includes("turn on flashlight")) {
        speak("Trying to turn on flashlight.");
        window.location.href = "flashlight://on";
        setTimeout(() => {
          window.location.href = "intent://flashlight#Intent;scheme=android;end";
        }, 600);
        return true;
      }

      if (text.includes("turn off torch") || text.includes("turn off flashlight")) {
        speak("Turning off flashlight.");
        window.location.href = "flashlight://off";
        return true;
      }

      // DOWNLOADS
      if (text.includes("open downloads") || text.includes("show downloads")) {
        speak("Opening downloads.");
        window.location.href = "downloads://";
        setTimeout(() => {
          window.location.href = "intent://downloads#Intent;scheme=android;end";
        }, 600);
        return true;
      }

      // FILE MANAGER
      if (text.includes("open files") || text.includes("open file manager")) {
        speak("Opening file manager.");
        window.location.href = "file://";
        setTimeout(() => {
          window.location.href = "intent://filemanager#Intent;scheme=android;end";
        }, 600);
        return true;
      }

      // CONTACTS
      if (text.includes("open contacts") || text.includes("show contacts")) {
        speak("Opening contacts.");
        window.location.href = "contacts://";
        setTimeout(() => {
          window.location.href = "intent://contacts#Intent;scheme=android;end";
        }, 600);
        return true;
      }

      // NOTIFICATIONS (very limited)
      if (text.includes("open notifications") || text.includes("show notifications")) {
        speak("Trying to open notifications.");
        window.location.href = "intent://notifications#Intent;scheme=android;end";
        return true;
      }

      // NAVIGATE TO PLACE
      if (text.startsWith("navigate to")) {
        const place = text.replace("navigate to", "").trim();
        speak("Navigating to " + place + ".");
        window.location.href = `comgooglemaps://?q=${encodeURIComponent(place)}`;
        setTimeout(() => {
          window.location.href =
            `https://www.google.com/maps?q=${encodeURIComponent(place)}`;
        }, 600);
        return true;
      }

      // PLAY STORE
      if (text.includes("open play store")) {
        speak("Opening Play Store.");
        window.location.href = "market://details?id=";
        setTimeout(() => {
          window.location.href = "https://play.google.com/store";
        }, 600);
        return true;
      }

      // TAKE ME HOME
      if (text.includes("take me home")) {
        speak("Opening navigation to home.");
        window.location.href = "comgooglemaps://?daddr=Home";
        setTimeout(() => {
          window.location.href =
            "https://www.google.com/maps/dir/?api=1&destination=home";
        }, 600);
        return true;
      }

      return false; // nothing matched
    }

    /* ========== Recognition lifecycle handlers ========== */
    if (recognition) {
      recognition.onstart = () => {
        currentlyListening = true;
        micZone.classList.add("listening");
        micBtn.classList.add("listening");
        transcriptDiv.textContent = "Listening...";
      };

      recognition.onend = () => {
        currentlyListening = false;
        micZone.classList.remove("listening");
        micBtn.classList.remove("listening");
      };

      recognition.onerror = (event) => {
        currentlyListening = false;
        micZone.classList.remove("listening");
        micBtn.classList.remove("listening");
        console.warn("Recognition error:", event.error);

        if (event.error === "no-speech") {
          transcriptDiv.textContent = "I did not catch that. Please tap the mic and speak again.";
        } else if (event.error === "not-allowed") {
          transcriptDiv.textContent = "Microphone permission is blocked. Please allow mic access in browser settings.";
        } else {
          transcriptDiv.textContent = "Error: " + event.error;
        }
      };

      recognition.onresult = async (event) => {
        const textRaw = event.results[0][0].transcript || "";
        const text = textRaw.toLowerCase().trim();
        transcriptDiv.textContent = "You said: " + text;

        // 1) try local commands (apps + system)
        if (handleLocalCommands(text)) {
          return;
        }

        // 2) otherwise, send to backend (Gemini / logic there)
        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
          });

          if (!res.ok) throw new Error("Network response was not ok");

          const data = await res.json();
          let reply = (data.reply || "").toString();
          reply = sanitizeForSpeech(reply);

          const shouldAutoListen = !!data.follow_up;
          speak(reply || "", { autoListen: shouldAutoListen });

        } catch (err) {
          console.error("Backend error:", err);
          const errMsg = "Something went wrong.";
          speak(errMsg);
        }
      };
    }

    /* ========== Mic button behavior ========== */
    micBtn.addEventListener("click", () => {
      if (!recognition) {
        alert("Speech Recognition not available in this browser.");
        return;
      }

      if (currentlyListening) {
        try {
          recognition.stop();
        } catch (e) {
          console.warn("stop failed:", e);
        }
        return;
      }

      try {
        recognition.start();
        userInitiated = true; // user has explicitly allowed mic
      } catch (e) {
        console.warn("start failed:", e);
      }
    });

    /* ========== Dev convenience: press 'm' to toggle mic ========== */
    window.addEventListener("keydown", (ev) => {
      if (ev.key === "m" || ev.key === "M") {
        micBtn.click();
      }
    });
  </script>
</body>
</html>
